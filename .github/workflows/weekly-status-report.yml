name: Weekly Jira status report

on:
  schedule:
    # GitHub cron is UTC: the job runs at midnight in Warsaw across CET/CEST.
    - cron: "0 22,23 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Warsaw schedule window
        id: schedule
        run: |
          if [ "$(TZ=Europe/Warsaw date +'%u %H')" = "3 00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.schedule.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate report
        if: steps.schedule.outputs.run == 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BOARD_ID: ${{ vars.JIRA_BOARD_ID }}
          JIRA_EPIC_LINK_FIELD: ${{ vars.JIRA_EPIC_LINK_FIELD }}
        run: python scripts/generate_weekly_status.py

      - name: Commit updated report
        if: steps.schedule.outputs.run == 'true'
        run: |
          if git diff --quiet -- STATUS_REPORT_TEMPLATE.md; then
            echo "The status report is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS_REPORT_TEMPLATE.md
          git commit -m "Update weekly Jira status report"
          git push
