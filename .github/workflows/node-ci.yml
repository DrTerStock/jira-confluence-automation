name: Node.js CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".gitignore"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "eslint.config.js"
      - "vitest.config.ts"
      - ".github/workflows/node-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".gitignore"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "eslint.config.js"
      - "vitest.config.ts"
      - ".github/workflows/node-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dashboard
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard -d dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dashboard:dashboard@localhost:5432/dashboard
      PORT: 3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
